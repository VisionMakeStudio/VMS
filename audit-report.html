<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>VMS Business Checkup Report</title>
<style>
:root{--navy:#003049;--deep:#08283d;--cream:#FDF0D5;--red:#C1121F;--blue:#669BBC;--bg:#eef3f5;--line:#dce5e9;--ink:#173041;--muted:#687c87;--green:#2f8b64}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.page{max-width:980px;margin:0 auto;padding:28px 18px 54px}.report{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,48,73,.09)}
.hero{background:linear-gradient(135deg,var(--navy),#0a4360);color:var(--cream);padding:25px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}.logo{width:132px;height:52px;object-fit:contain;object-position:left center;display:block;margin-bottom:9px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:950;color:var(--blue)}h1{margin:4px 0 3px;font-size:30px;line-height:1.05;letter-spacing:-.035em}.industry{font-size:14px;color:rgba(253,240,213,.65)}.score{text-align:right}.score strong{display:block;font-size:72px;line-height:.82;letter-spacing:-.07em}.score span{font-size:14px;color:rgba(253,240,213,.62);font-weight:800}.grade{margin-top:7px;font-size:13px;font-weight:900}
.body{padding:22px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{border:1px solid var(--line);border-radius:12px;padding:12px}.cat strong{display:block;font-size:25px;color:var(--navy)}.cat span{font-size:12px;color:var(--muted)}
.note{margin-top:16px;padding:14px 15px;border-radius:11px;background:#f4f7f8;color:#526672;font-size:14px;line-height:1.5}.section-label{font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:18px 0 7px}.priority{border:1px solid #e6c9cc;background:#fff8f8;border-radius:12px;padding:12px;margin-top:12px}.priority h2{font-size:15px;color:#8d1721;margin:0 0 7px}.priority-item{padding:8px 0;border-top:1px solid #f0dfe1;font-size:13px;line-height:1.45;color:#5e6870}.priority-item:first-of-type{border-top:0}.priority-item strong{color:#8d1721}.breakdown{display:grid;gap:9px}.break-card{border:1px solid var(--line);border-radius:13px;padding:13px}.break-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.break-head h2{font-size:17px;margin:0;color:var(--navy)}.break-head strong{font-size:18px;color:var(--navy)}.issues{margin-top:8px}.issue{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #edf1f3;padding:7px 0}.issue:first-child{border-top:0}.issue b{display:block;font-size:13px;color:var(--ink)}.issue span{display:block;font-size:12px;color:#7a8b95;margin-top:2px}.issue strong{font-size:12px;color:var(--red);white-space:nowrap}.vms-note{margin-top:8px;background:#f5f8f9;border-radius:9px;padding:10px 11px;color:#526672;font-size:12px;line-height:1.45}.recommend{margin-top:12px;padding:14px;border-radius:11px;background:#f4f7f8;color:#526672;font-size:14px;line-height:1.5}.footer{text-align:center;color:#8a98a1;font-size:11px;padding:18px 12px 4px}.bad{max-width:640px;margin:80px auto;padding:24px;border:1px solid var(--line);background:#fff;border-radius:18px;text-align:center}.bad h1{color:var(--navy);font-size:24px}.bad p{color:var(--muted);line-height:1.5}
@media(max-width:680px){.page{padding:0}.report{border:0;border-radius:0;box-shadow:none}.hero{padding:20px 16px;grid-template-columns:minmax(0,1fr) auto;gap:10px}.logo{width:110px;height:44px}.hero h1{font-size:22px}.score strong{font-size:50px}.body{padding:14px}.cats{grid-template-columns:1fr 1fr}}
@media print{@page{size:letter;margin:.35in}html,body{background:#fff}.page{max-width:none;padding:0}.report{border:0;box-shadow:none;border-radius:0}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.footer{padding-bottom:0}.priority,.break-card,.note,.recommend{break-inside:avoid;page-break-inside:avoid}}
</style>
</head>
<body>
<main id="root"></main>
<script>
(async()=>{
  const DISPLAY={website:'Website',google:'Local Presence',reviews:'Reviews',systems:'Systems'};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const decode=str=>JSON.parse(decodeURIComponent(escape(atob(str))));
  const root=document.getElementById('root');
  function fail(message='This client report link is incomplete, expired, disabled, or no longer valid. Please ask Vision Make Studio for a new report link.'){
    root.innerHTML=`<section class="bad"><h1>Report unavailable</h1><p>${esc(message)}</p></section>`;
  }
  function render(d){
    if(!d||d.v!==2||!d.scores){fail();return}
    const cats=['website','google','reviews','systems'];
    const priority=Array.isArray(d.priority_findings)?d.priority_findings:[];
    const breakdown=d.breakdown||{};
    const grade=d.grade||'';
    const priorityHtml=priority.length?`<section class="priority"><h2>Priority Findings</h2>${priority.slice(0,5).map(x=>`<div class="priority-item"><strong>${esc(x.title||'Priority finding')}:</strong> ${esc(x.finding||'')}</div>`).join('')}</section>`:'';
    const breakdownHtml=cats.map(cat=>{
      const b=breakdown[cat]||{},items=Array.isArray(b.items)?b.items:[];
      return `<article class="break-card"><div class="break-head"><h2>${DISPLAY[cat]}</h2><strong>${Number(d.scores[cat]||0)}/100</strong></div><div class="issues">${items.length?items.map(i=>`<div class="issue"><div><b>${esc(i.title||'')}</b><span>${esc(i.label||'')}</span></div><strong>${Number(i.points||0)}/${Number(i.max||0)}</strong></div>`).join(''):'<div class="vms-note">No point-loss findings were recorded for this section.</div>'}</div>${b.note?`<div class="vms-note"><strong>VMS Notes</strong><br>${esc(b.note)}</div>`:''}</article>`
    }).join('');
    root.innerHTML=`<div class="page"><article class="report"><header class="hero"><div><img class="logo" src="assets/vms-logo.png" alt="Vision Make Studio"><div class="eyebrow">Vision Make Studio</div><h1>${esc(d.business_name||'Business Checkup')}</h1><div class="industry">${esc(d.industry||'Business audit')}</div></div><div class="score"><strong>${Number(d.overall||0)}</strong><span>/100</span><div class="grade">${esc(grade)}</div></div></header><div class="body"><div class="cats">${cats.map(cat=>`<div class="cat"><strong>${Number(d.scores[cat]||0)}</strong><span>${DISPLAY[cat]}</span></div>`).join('')}</div><div class="note">${esc(d.meaning||'')}</div>${priorityHtml}<div class="section-label">Scoring Breakdown</div><section class="breakdown">${breakdownHtml}</section><div class="recommend"><strong>Recommended Next Step</strong><br>${esc(d.recommendation||'Recommendations will appear after scoring.')}</div><div class="footer">VMS Business Checkup · Vision Make Studio</div></div></article></div>`;
    document.title=`${d.business_name||'VMS'} · Business Checkup Report`;
  }

  root.innerHTML='<section class="bad"><h1>Loading report…</h1><p>Opening your Vision Make Studio Business Checkup.</p></section>';
  const hash=location.hash||'';
  if(hash.startsWith('#token=')){
    const token=decodeURIComponent(hash.slice(7));
    try{
      const res=await fetch('/api/public-audit-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data?.report){fail(data?.error||undefined);return}
      render(data.report);return;
    }catch{fail();return}
  }
  if(hash.startsWith('#report=')){
    let d;try{d=decode(hash.slice(8))}catch{fail();return}
    render(d);return;
  }
  fail();
})();
</script>
</body>
</html>
