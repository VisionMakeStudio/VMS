<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VMS Admin Login</title><link rel="stylesheet" href="../assets/vms-suite.css"><script src="../assets/config.js"></script><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#003049,#08283d)!important;padding:20px}.login{width:min(460px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 28px 90px rgba(0,0,0,.25)}.login img{display:block;width:96px;max-height:56px;object-fit:contain;background:#003049;border-radius:13px;padding:8px;margin-bottom:22px}.login h1{margin:0 0 7px;color:#003049;font-size:32px}.login p{color:#6f818b;line-height:1.55}.login label{display:block;font-size:12px;font-weight:900;margin:18px 0 7px}.login input{width:100%;height:52px;padding:0 14px}.login button{width:100%;margin-top:14px}.status{min-height:20px;margin-top:12px;text-align:center;color:#687d87;font-size:12px}</style></head><body><main class="login"><img src="../assets/vms-logo.png" alt="Vision Make Studio"><div class="vms-production-badge">Private Admin</div><h1>VMS Admin</h1><p>Use your authorized VMS owner email. A secure sign-in link is sent to your inbox. Your public website does not expose this private Admin URL.</p><form id="f"><label>Email address</label><input id="e" type="email" required autocomplete="email" placeholder="info@visionmakestudio.com"><button class="btn primary" type="submit">Email Admin Sign-In Link</button><div class="status" id="s"></div></form></main><script src="../assets/vms-core.js"></script><script>f.onsubmit=async ev=>{ev.preventDefault();s.textContent='Sending secure link…';const email=e.value.trim().toLowerCase();if(location.protocol==='file:'){localStorage.setItem('vms_local_admin_session',email);location.href='index.html';return}try{const sb=await VMSAuth.client();if(!sb)throw new Error('Supabase is not configured yet.');const redirectTo=new URL('/admin/',location.origin).href;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:false}});if(error)throw error;s.textContent='Check your email for the secure admin link.'}catch(err){s.textContent=err.message}}</script></body></html>
