<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VMS Admin — QR and LinkHub Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Unbounded:wght@700;900&display=swap">
<style>


:root{--pvh:54px}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--pvh) + 84px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%;background:#F3F7FA}
html[data-theme="dark"]{background:#001a29}
@media not all{html:not([data-theme="light"]){background:#001a29}}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body *,body *::before,body *::after{box-sizing:border-box}
#vmsSuite{
  --bg:#F3F7FA;--surface:#FFFFFF;--surface2:#F1F7FA;--ink:#102f40;--muted:#526a77;--line:rgba(0,48,73,.12);--line2:rgba(0,48,73,.22);
  --navy:#003049;--red:#C1121F;--blue:#669BBC;--cream:#FDF0D5;--orange:#EB5E28;--ok:#22795A;--okbg:#E2F3EC;
  --pri:#003049;--prifg:#FFFFFF;--tint:#E8F1F6;--warmbg:#FFF1E6;--warmfg:#A8400F;--shadow:0 12px 34px rgba(0,48,73,.08);--shadow-lg:0 30px 70px rgba(0,48,73,.18);
  --display:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
}
@media not all{html:not([data-theme="light"]) #vmsSuite{
  --bg:#001a29;--surface:#00263a;--surface2:#0a3550;--ink:#FDF0D5;--muted:rgba(253,240,213,.74);--line:rgba(253,240,213,.14);--line2:rgba(253,240,213,.3);
  --pri:#FDF0D5;--prifg:#003049;--tint:rgba(102,155,188,.18);--warmbg:rgba(235,94,40,.16);--warmfg:#FFB08A;--ok:#6FD0A9;--okbg:rgba(111,208,169,.16);--shadow:0 12px 34px rgba(0,0,0,.35);--shadow-lg:0 30px 70px rgba(0,0,0,.5);color-scheme:dark}}
html[data-theme="dark"] #vmsSuite{
  --bg:#001a29;--surface:#00263a;--surface2:#0a3550;--ink:#FDF0D5;--muted:rgba(253,240,213,.74);--line:rgba(253,240,213,.14);--line2:rgba(253,240,213,.3);
  --pri:#FDF0D5;--prifg:#003049;--tint:rgba(102,155,188,.18);--warmbg:rgba(235,94,40,.16);--warmfg:#FFB08A;--ok:#6FD0A9;--okbg:rgba(111,208,169,.16);--shadow:0 12px 34px rgba(0,0,0,.35);--shadow-lg:0 30px 70px rgba(0,0,0,.5);color-scheme:dark}
#vmsSuite *,#vmsSuite *::before,#vmsSuite *::after{box-sizing:border-box}
#vmsSuite [hidden]{display:none!important}
#vmsSuite{background:var(--bg);-webkit-text-size-adjust:100%}
#vmsSuite{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
#vmsSuite img,#vmsSuite svg,#vmsSuite canvas{display:block;max-width:100%}
#vmsSuite button,#vmsSuite input,#vmsSuite select,#vmsSuite textarea{font:inherit;color:inherit}
#vmsSuite button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#vmsSuite a{color:inherit;text-decoration:none}
#vmsSuite :focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
#vmsSuite .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);border:0}
#vmsSuite h1,#vmsSuite h2,#vmsSuite h3,#vmsSuite h4,#vmsSuite p{margin:0}
#vmsSuite .ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#vmsSuite .logo-c,#vmsSuite .logo-n{height:34px;width:auto}
#vmsSuite .logo-c{display:none}
html[data-theme="dark"] #vmsSuite .logo-c{display:block}
html[data-theme="dark"] #vmsSuite .logo-n{display:none}
@media not all{html:not([data-theme="light"]) #vmsSuite .logo-c{display:block}
html:not([data-theme="light"]) #vmsSuite .logo-n{display:none}}
#vmsSuite .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:14.5px;line-height:1;white-space:nowrap;transition:transform .15s,background .18s,border-color .18s,box-shadow .18s}
#vmsSuite .btn:active{transform:scale(.97)}
#vmsSuite .btn.pri{background:var(--pri);color:var(--prifg)}
#vmsSuite .btn.pri:hover{box-shadow:0 8px 20px rgba(0,48,73,.25)}
#vmsSuite .btn.red{background:var(--red);color:#fff}
#vmsSuite .btn.gh{background:var(--surface);border-color:var(--line2);color:var(--ink)}
#vmsSuite .btn.gh:hover{border-color:var(--ink)}
#vmsSuite .btn.dg{background:transparent;border-color:rgba(193,18,31,.4);color:var(--red)}
#vmsSuite .btn.dg:hover{background:var(--red);color:#fff}
html[data-theme="dark"] #vmsSuite .btn.dg{color:#ff8a92}
#vmsSuite .btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
#vmsSuite .btn{max-width:100%}
#vmsSuite .ai-h .btn{white-space:normal;text-align:center;line-height:1.25;min-height:48px;flex:1 1 220px}
#vmsSuite .btn[disabled]{opacity:.45;pointer-events:none}
#vmsSuite .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;line-height:1.3;background:var(--tint);color:var(--ink);white-space:nowrap}
#vmsSuite .chip.new{background:var(--tint)}
#vmsSuite .chip.audit{background:var(--warmbg);color:var(--warmfg)}
#vmsSuite .chip.prop{background:transparent;border:1px solid var(--line2)}
#vmsSuite .chip.won,#vmsSuite .chip.ok{background:var(--okbg);color:var(--ok)}
#vmsSuite .chip.bad{background:rgba(193,18,31,.12);color:var(--red)}
html[data-theme="dark"] #vmsSuite .chip.bad{color:#ff8a92}
#vmsSuite .inp,#vmsSuite .sel,#vmsSuite .txt{width:100%;min-height:46px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);font-size:15px;transition:border-color .2s,box-shadow .2s}
#vmsSuite .txt{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.5}
#vmsSuite .inp:focus,#vmsSuite .txt:focus,#vmsSuite .sel:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(102,155,188,.3)}
#vmsSuite .fld{display:grid;gap:6px}
#vmsSuite .fld>label,#vmsSuite .fld>span.l{font-size:13.5px;font-weight:600;color:var(--ink)}
#vmsSuite .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
#vmsSuite .muted{color:var(--muted)}
#vmsSuite .title{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.15}
#vmsSuite #app{min-height:calc(100dvh - var(--pvh))}
#vmsSuite .shell{display:block}
#vmsSuite .side{display:none}
#vmsSuite .main{min-width:0}
#vmsSuite .top{position:sticky;top:calc(var(--pvh) + env(safe-area-inset-top,0px));z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#vmsSuite .top h1{font-family:var(--display);font-size:1.05rem;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vmsSuite .ib{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center}
#vmsSuite .view{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto;animation:su-viewIn .35s ease both}
@keyframes su-viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#vmsSuite .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#vmsSuite .tabbar button{position:relative;display:grid;justify-items:center;gap:3px;min-height:56px;padding:6px 2px;border:0;background:transparent;border-radius:12px;color:var(--muted);font-size:12.5px;font-weight:600}
#vmsSuite .tabbar button[aria-current="page"]{color:var(--ink)}
#vmsSuite .tabbar button[aria-current="page"] .ico{stroke-width:2.3}
#vmsSuite .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:2px;width:26px;height:3px;border-radius:9px;background:var(--pri)}
#vmsSuite .dotb{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
#vmsSuite .greet{display:grid;gap:4px;margin:6px 0 16px}
#vmsSuite .greet h2{font-family:var(--display);font-size:clamp(1.35rem,5.5vw,2rem);letter-spacing:-.03em;line-height:1.12}
#vmsSuite .greet p{color:var(--muted)}
#vmsSuite .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#vmsSuite .kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0}
#vmsSuite .kpi .l{font-size:13px;color:var(--muted);font-weight:500}
#vmsSuite .kpi .v{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,5.6vw,1.75rem);letter-spacing:-.04em;line-height:1.1}
#vmsSuite .kpi .d{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted)}
#vmsSuite .kpi .d b{font-weight:600;color:var(--ok)}
#vmsSuite .kpi svg.sp{width:100%;height:30px;overflow:visible}
#vmsSuite .sp path{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#vmsSuite .sp path.fillp{fill:url(#spf);stroke:none;opacity:.5}
#vmsSuite .grid2{display:grid;gap:14px;margin-top:14px}
#vmsSuite .sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#vmsSuite .sect-h h3{font-family:var(--display);font-size:.98rem;letter-spacing:-.02em}
#vmsSuite .sect-h a,#vmsSuite .sect-h button.lnk{font-size:14px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:8px 0}
#vmsSuite .att{display:grid;gap:0}
#vmsSuite .att .row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
#vmsSuite .att .row:last-child{border:0;padding-bottom:0}
#vmsSuite .att .row:first-child{padding-top:0}
#vmsSuite .att .dt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint)}
#vmsSuite .att .dt.w{background:var(--warmbg);color:var(--warmfg)}
#vmsSuite .att .dt.b{background:rgba(193,18,31,.12);color:var(--red)}
#vmsSuite .att .dt.o{background:var(--okbg);color:var(--ok)}
html[data-theme="dark"] #vmsSuite .att .dt.b{color:#ff8a92}
#vmsSuite .att b{display:block;font-weight:600;line-height:1.35}
#vmsSuite .att span.s{display:block;color:var(--muted);font-size:13.5px}
#vmsSuite .att .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#vmsSuite .funnel{display:grid;gap:12px}
#vmsSuite .fbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--tint);gap:3px}
#vmsSuite .fbar i{display:block;min-width:8px;border-radius:99px;transition:flex .6s cubic-bezier(.2,.8,.2,1)}
#vmsSuite .fleg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#vmsSuite .fleg button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px}
#vmsSuite .fleg button:hover{border-color:var(--ink)}
#vmsSuite .fleg em{font-style:normal;font-family:var(--display);font-size:15px}
#vmsSuite .tl{display:grid;gap:0}
#vmsSuite .tl .r{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:16px;position:relative}
#vmsSuite .tl .r::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
#vmsSuite .tl .r:last-child{padding-bottom:0}
#vmsSuite .tl .r:last-child::before{display:none}
#vmsSuite .tl .r i{width:14px;height:14px;border-radius:50%;background:var(--blue);margin-top:4px;box-shadow:0 0 0 4px var(--tint)}
#vmsSuite .tl .r b{font-weight:600;display:block;line-height:1.35}
#vmsSuite .tl .r span{color:var(--muted);font-size:13.5px}
#vmsSuite .tools{display:grid;gap:10px;margin-bottom:14px}
#vmsSuite .pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#vmsSuite .pills::-webkit-scrollbar{display:none}
#vmsSuite .pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:14.5px;white-space:nowrap;transition:all .18s}
#vmsSuite .pill em{font-style:normal;font-size:13px;opacity:.7}
#vmsSuite .pill[aria-pressed="true"]{background:var(--pri);color:var(--prifg);border-color:var(--pri)}
#vmsSuite .split{display:grid;gap:14px}
#vmsSuite .list{display:grid;gap:10px}
#vmsSuite .li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .18s,transform .15s,box-shadow .18s}
#vmsSuite .li:hover{border-color:var(--line2)}
#vmsSuite .li[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
#vmsSuite .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,var(--navy),var(--blue));color:#fff;font-weight:700;font-size:15px}
#vmsSuite .li b{display:block;font-weight:600;line-height:1.3}
#vmsSuite .li span.s{display:block;color:var(--muted);font-size:13.5px}
#vmsSuite .li .end{display:grid;justify-items:end;gap:4px;font-size:13px;color:var(--muted)}
#vmsSuite .empty{padding:34px 16px;text-align:center;color:var(--muted)}
#vmsSuite .dash{display:grid;gap:14px}
#vmsSuite .kv{display:grid;gap:0}
#vmsSuite .kv .r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
#vmsSuite .kv .r:last-child{border:0}
#vmsSuite .kv .r span{color:var(--muted)}
#vmsSuite .kv .r b{font-weight:600;text-align:right}
#vmsSuite .tags{display:flex;flex-wrap:wrap;gap:8px}
#vmsSuite .mini{display:flex;align-items:center;gap:14px}
#vmsSuite .ring{position:relative;width:76px;height:76px;flex:none}
#vmsSuite .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#vmsSuite .ring circle{fill:none;stroke-width:9}
#vmsSuite .ring .bg{stroke:var(--tint)}
#vmsSuite .ring .fg{stroke:var(--navy);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
html[data-theme="dark"] #vmsSuite .ring .fg{stroke:var(--cream)}
#vmsSuite .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;letter-spacing:-.04em}
#vmsSuite .notes{display:grid;gap:8px}
#vmsSuite .note{padding:11px 13px;border-radius:14px;background:var(--surface2);font-size:14.5px}
#vmsSuite .note small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
#vmsSuite .audit{display:grid;gap:14px}
#vmsSuite .cat{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
#vmsSuite .cat .h{display:flex;align-items:center;justify-content:space-between;gap:10px}
#vmsSuite .cat .h b{font-weight:600}
#vmsSuite .cat .h .n{font-family:var(--display);font-size:1.25rem;letter-spacing:-.04em}
#vmsSuite input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent}
#vmsSuite input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--navy) var(--p,50%),var(--tint) var(--p,50%))}
#vmsSuite input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--tint)}
#vmsSuite input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--navy)}
#vmsSuite input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--navy);margin-top:-9px;box-shadow:0 3px 8px rgba(0,48,73,.3)}
#vmsSuite input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--navy)}
html[data-theme="dark"] #vmsSuite input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--cream) var(--p,50%),var(--tint) var(--p,50%))}
html[data-theme="dark"] #vmsSuite input[type=range]::-webkit-slider-thumb{border-color:var(--cream);background:var(--navy)}
#vmsSuite .ev{display:grid;gap:6px;margin:0;padding:0;list-style:none}
#vmsSuite .ev li{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);animation:su-viewIn .4s ease both}
#vmsSuite .ev li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);margin-top:8px;flex:none}
#vmsSuite .ai-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#vmsSuite .prog{display:grid;gap:8px}
#vmsSuite .prog .s{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted)}
#vmsSuite .prog .s i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
#vmsSuite .prog .s.on{color:var(--ink);font-weight:600}
#vmsSuite .prog .s.on i{border-color:var(--blue);border-top-color:transparent;animation:su-spin .8s linear infinite}
#vmsSuite .prog .s.done{color:var(--ink)}
#vmsSuite .prog .s.done i{background:var(--ok);border-color:var(--ok)}
#vmsSuite .prog .s.done i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes su-spin{to{transform:rotate(360deg)}}
#vmsSuite .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
#vmsSuite .bars .b{flex:1;display:grid;justify-items:center;gap:6px;height:100%;align-content:end}
#vmsSuite .bars .b i{display:block;width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--blue),var(--navy));height:var(--h,0px);transition:height .8s cubic-bezier(.2,.8,.2,1)}
html[data-theme="dark"] #vmsSuite .bars .b i{background:linear-gradient(180deg,var(--blue),#3f7fa3)}
#vmsSuite .bars .b span{font-size:12.5px;color:var(--muted)}
#vmsSuite .split2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#vmsSuite .hero-p{border-radius:24px;padding:20px;background:linear-gradient(140deg,var(--navy),#2b6a91);color:#fff;display:grid;gap:14px;box-shadow:var(--shadow-lg)}
#vmsSuite .hero-p h2{font-family:var(--display);font-size:clamp(1.3rem,5.2vw,1.8rem);letter-spacing:-.03em;line-height:1.15}
#vmsSuite .hero-p p{opacity:.88}
#vmsSuite .steps4{display:grid;gap:0}
#vmsSuite .steps4 .st{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:14px;position:relative;align-items:start}
#vmsSuite .steps4 .st::before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:2px;background:rgba(255,255,255,.25)}
#vmsSuite .steps4 .st:last-child{padding-bottom:0}
#vmsSuite .steps4 .st:last-child::before{display:none}
#vmsSuite .steps4 .st i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center}
#vmsSuite .steps4 .st.done i{background:#fff;border-color:#fff}
#vmsSuite .steps4 .st.done i::after{content:"";width:5px;height:9px;border:solid var(--navy);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#vmsSuite .steps4 .st.now i{border-color:var(--orange);background:rgba(235,94,40,.25);box-shadow:0 0 0 4px rgba(235,94,40,.25)}
#vmsSuite .steps4 .st b{font-weight:600}

#vmsSuite .b14{display:flex;align-items:flex-end;gap:5px;height:110px}
#vmsSuite .b14 .c{flex:1;display:grid;align-content:end;height:100%}
#vmsSuite .b14 .c i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--blue),var(--navy));height:var(--h,0px);transition:height .7s cubic-bezier(.2,.8,.2,1)}
#vmsSuite .b14-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
#vmsSuite .sfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#vmsSuite .lhs{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
#vmsSuite .lhmeter{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
#vmsSuite .lhmeter b.t{display:block;font-weight:600;font-size:16px}
#vmsSuite .lhmeter .nx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#vmsSuite .lhmeter .nx span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--warmbg);color:var(--warmfg);font-weight:600}
#vmsSuite .lh-sec{border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
#vmsSuite .lh-sec>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:62px;padding:0 18px;cursor:pointer;font-weight:600}
#vmsSuite .lh-sec>summary::-webkit-details-marker{display:none}
#vmsSuite .lh-sec>summary .ico{color:var(--muted)}
#vmsSuite .lh-sec>summary small{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
#vmsSuite .lh-sec>summary::after{content:"";flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;transition:transform .2s}
#vmsSuite .lh-sec[open]>summary::after{transform:rotate(-135deg)}
#vmsSuite .lh-body{padding:4px 18px 20px;display:grid;gap:16px}
#vmsSuite .frow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
#vmsSuite .tog{position:relative;width:54px;height:32px;border-radius:99px;border:0;background:var(--line2);transition:background .2s;flex:none}
#vmsSuite .tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
#vmsSuite .tog[aria-checked="true"]{background:var(--ok)}
#vmsSuite .tog[aria-checked="true"]::after{transform:translateX(22px)}
#vmsSuite .tog::before{content:"";position:absolute;inset:-7px -4px}
#vmsSuite .crow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--surface2)}
#vmsSuite .crow .stack{display:grid;gap:8px;min-width:0}
#vmsSuite .crow .nm{font-weight:600;display:flex;align-items:center;gap:8px}
#vmsSuite .lrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border-radius:14px;background:var(--surface2);align-items:start}
#vmsSuite .lrow .f{display:grid;gap:8px;min-width:0}
#vmsSuite .lrow .ops{display:grid;gap:6px;grid-template-columns:repeat(2,44px)}
#vmsSuite .ib2{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center}
#vmsSuite .ib2:disabled{opacity:.35}
#vmsSuite .ib2.dg{color:var(--red)}
#vmsSuite .ib2 .ico{width:18px;height:18px}
#vmsSuite .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
#vmsSuite .themes button{display:grid;gap:8px;justify-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:13.5px}
#vmsSuite .themes button i{display:block;width:100%;height:52px;border-radius:12px;background:linear-gradient(145deg,var(--a),var(--b))}
#vmsSuite .themes button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--tint)}
#vmsSuite .urlbox{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:12px;background:var(--surface);overflow:hidden}
#vmsSuite .urlbox span{padding:0 10px 0 14px;color:var(--muted);font-size:14px;white-space:nowrap}
#vmsSuite .urlbox input{border:0;background:transparent;min-height:46px;flex:1;min-width:0;font-size:15px;outline:none;padding:0 12px 0 0}
#vmsSuite .tlist{display:grid;gap:8px}
#vmsSuite .tlist .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14.5px}
#vmsSuite .tlist .t{height:8px;border-radius:99px;background:var(--tint);overflow:hidden;grid-column:1/-1}
#vmsSuite .tlist .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--navy))}
#vmsSuite .lh-side .card{padding:16px;display:grid;gap:12px;justify-items:center}
#vmsSuite .lh-side .sect-h{width:100%;margin:0}
#vmsSuite .prevfab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:55;box-shadow:0 14px 34px rgba(0,48,73,.35)}
@media (min-width:700px){#vmsSuite .qgrid{grid-template-columns:repeat(2,1fr)}
#vmsSuite .tpls{margin:0 0 14px;padding:2px 0;flex-wrap:wrap;overflow:visible}}
@media (min-width:1000px){#vmsSuite .qgrid{grid-template-columns:repeat(3,1fr)}
#vmsSuite .qstudio{grid-template-columns:minmax(300px,390px) minmax(0,1fr);align-items:start;gap:18px}
#vmsSuite .qprev{position:sticky;top:calc(var(--pvh) + 92px)}
#vmsSuite .lhs{grid-template-columns:minmax(0,1fr) 360px;align-items:start;gap:18px}
#vmsSuite .lh-side{position:sticky;top:calc(var(--pvh) + 92px)}
#vmsSuite .prevfab{display:none}
#vmsSuite .qcard:hover{transform:translateY(-2px)}}
@media (max-width:999px){#vmsSuite .lh-side{display:none}}
#vmsSuite .grp2{display:grid;gap:6px}
#vmsSuite .l2{font-weight:600;font-size:13.5px}
#vmsSuite .mcat{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
#vmsSuite .mhead{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
#vmsSuite .mrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:8px}
#vmsSuite .week{display:grid;gap:8px}
#vmsSuite .wd{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
#vmsSuite .pvt{display:inline-flex;padding:5px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow);margin-top:6px}
#vmsSuite .pvt button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:99px;background:transparent;font-weight:600;color:var(--muted)}
#vmsSuite .pvt button[aria-pressed="true"]{background:var(--pri);color:var(--prifg)}
#vmsSuite .dotp{width:8px;height:8px;border-radius:50%;background:currentColor}
#vmsSuite .lhqr{display:grid;justify-items:center;gap:12px}
#vmsSuite .lh-side .card{padding:16px 16px 18px}

.lrow.drag-over{outline:2px dashed var(--blue);border-radius:14px;background:var(--tint)}
.drag-handle{opacity:.55;transition:opacity .15s}.drag-handle:hover{opacity:1}

/* Studios page: full-height app shell */
html,body{margin:0;padding:0;height:100%;overflow:hidden}
#app{height:100dvh;overflow:hidden}

<style id="vms-lh-phone">
/* LinkHub phone preview — from the approved suite preview */
#vmsSuite .lhp{--bg:#fff;--tx:#102f40;--bb:#003049;--bf:#fff;--soft:#F1F7FA;--line:rgba(0,48,73,.12);--mut:#526a77;--ic:#003049;--hd1:#003049;--hd2:#669BBC;--ac:#003049;--av:linear-gradient(145deg,#003049,#2b6a91);--avt:#FDF0D5;
  width:min(100%,292px);border-radius:46px;padding:10px;background:#171717;box-shadow:0 30px 70px rgba(0,30,46,.38),0 0 0 1px rgba(0,0,0,.35);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#vmsSuite .lhp *{box-sizing:border-box}
#vmsSuite .lhp svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
#vmsSuite .lhp :where(button){font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#vmsSuite .lhp-s{position:relative;border-radius:36px;height:560px;overflow:hidden;background:var(--bg);color:var(--tx)}
#vmsSuite .lhp-s::before{content:"";position:absolute;top:9px;left:50%;width:88px;height:24px;margin-left:-44px;background:#000;border-radius:99px;z-index:9}
#vmsSuite .lhp-c{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:50px 18px 22px;text-align:center;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#vmsSuite .lhp-c::-webkit-scrollbar,#vmsSuite .lhp-o::-webkit-scrollbar{display:none}
#vmsSuite .lhp-av{width:92px;height:92px;border-radius:50%;margin:2px auto 12px;display:grid;place-items:center;background:var(--av);color:var(--avt);font-weight:800;font-size:27px;letter-spacing:-.02em;box-shadow:0 8px 22px rgba(0,30,46,.22)}
#vmsSuite .lhp-nm{margin:0;font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.15;word-break:break-word}
#vmsSuite .lhp-bio{margin:7px auto 16px;font-size:15px;line-height:1.45;opacity:.92;max-width:30ch}
#vmsSuite .lhp-ct{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px;margin:0 0 12px}
#vmsSuite .lhp-ct button{display:grid;gap:6px;justify-items:center;padding:11px 2px 9px;border-radius:16px;border:1px solid var(--line);background:var(--soft);color:var(--tx);font-weight:700;font-size:11.5px;line-height:1;min-width:0;min-height:60px}
#vmsSuite .lhp-ct button svg{color:var(--ic)}
#vmsSuite .lhp-ft{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;margin:0 0 14px}
#vmsSuite .lhp-ft button{display:grid;gap:7px;justify-items:center;padding:13px 4px 11px;border-radius:18px;background:var(--soft);border:1px solid var(--line);color:var(--tx);font-weight:700;font-size:12.5px;line-height:1.1;min-width:0}
#vmsSuite .lhp-ft button span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ic);box-shadow:0 2px 8px rgba(0,30,46,.12)}
#vmsSuite .lhp-ln{display:grid;gap:11px;grid-template-columns:minmax(0,1fr)}
#vmsSuite .lhp-ln .lhp-lk{text-wrap:balance;position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:12px 46px;border:0;background:var(--bb);color:var(--bf);font-weight:700;font-size:15.5px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
#vmsSuite .lhp-ln.lhp-s-round .lhp-lk{border-radius:20px}
#vmsSuite .lhp-ln.lhp-s-pill .lhp-lk{border-radius:999px}
#vmsSuite .lhp-ln.lhp-s-square .lhp-lk{border-radius:6px}

        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;

            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;

            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;

        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

// Drag-to-reorder for LinkHub links (pointer events: works with mouse and touch)
(function(){
  let drag=null;
  const rows=()=>Array.from(document.querySelectorAll('#lhLinks .lrow'));
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest('[data-drag-id]');if(!h||e.button>0)return;
    const row=h.closest('.lrow');if(!row)return;
    e.preventDefault();
    drag={id:h.dataset.dragId,row,pid:e.pointerId,over:null};
    row.classList.add('dragging');document.body.classList.add('lh-reordering');
    try{h.setPointerCapture(e.pointerId)}catch(_){}
  });
  document.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    e.preventDefault();
    let target=null;
    for(const r of rows()){const b=r.getBoundingClientRect();if(e.clientY>=b.top&&e.clientY<=b.bottom){target=r;break}}
    rows().forEach(r=>r.classList.toggle('drag-over',r===target&&r!==drag.row));
    drag.over=target&&target!==drag.row?target:null;
  },{passive:false});
  const finish=e=>{
    if(!drag||(e&&e.pointerId!==drag.pid))return;
    const d=drag;drag=null;
    d.row.classList.remove('dragging');document.body.classList.remove('lh-reordering');
    rows().forEach(r=>r.classList.remove('drag-over'));
    if(!d.over)return;
    const toId=d.over.querySelector('[data-drag-id]')?.dataset.dragId;
    const h=hubOf();if(!h||!toId)return;
    const fi=h.links.findIndex(l=>l.id===d.id),ti=h.links.findIndex(l=>l.id===toId);
    if(fi<0||ti<0||fi===ti)return;
    h.links.splice(ti,0,h.links.splice(fi,1)[0]);
    renderView();toast('Link order updated. Save to keep it.');
  };
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',finish);
  // Keyboard: focus the handle, then Arrow Up / Arrow Down
  document.addEventListener('keydown',e=>{
    const hd=e.target.closest&&e.target.closest('[data-drag-id]');if(!hd||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
    e.preventDefault();const h=hubOf();if(!h)return;
    const fi=h.links.findIndex(l=>l.id===hd.dataset.dragId),ti=fi+(e.key==='ArrowUp'?-1:1);
    if(fi<0||ti<0||ti>=h.links.length)return;
    h.links.splice(ti,0,h.links.splice(fi,1)[0]);renderView();
    requestAnimationFrame(()=>document.querySelector('[data-drag-id="'+hd.dataset.dragId+'"]')?.focus());
  });
})();

  if(act==='qr-new')return sheet(qrForm(null));
  if(act==='qr-edit')return sheet(qrForm(S.p.qrs.find(q=>q.id===d.id)));
  if(act==='qr-dl')return toast('QR image downloaded');
  if(act==='qr-act'){const q=S.p.qrs.find(x=>x.id===d.id);return sheet(head(q.name+' activity')+'<div class="qm" style="margin-bottom:14px"><div><span>Total</span><b>'+q.total+'</b></div><div><span>This month</span><b>'+q.total+'</b></div><div><span>Last scan</span><b style="font-size:.8rem">'+esc(q.last.replace('Today, ',''))+'</b></div></div><div class="tl"><div class="r"><i></i><div><b>Scan recorded</b><span>Today, 9:12 AM · iPhone</span></div></div><div class="r"><i></i><div><b>Scan recorded</b><span>Yesterday, 6:40 PM · Android</span></div></div><div class="r"><i></i><div><b>Scan recorded</b><span>Yesterday, 12:05 PM · iPhone</span></div></div></div>')}
  if(act==='qr-del'){const q=S.p.qrs.find(x=>x.id===d.id);return sheet(head('Delete this QR?',esc(q.name))+'<p class="muted" style="margin-bottom:14px">'+(q.mode==='dynamic'?'This is a tracked QR. Printed copies will stop working and its scan history will be deleted. Archive keeps the history and lets you bring it back.':'Printed copies of a static QR keep working because the address is inside the code. Deleting only removes it from your portal.')+'</p><div class="formgrid"><button class="btn dg" type="button" data-act="qr-kill" data-id="'+q.id+'">Delete permanently</button><button class="btn gh" type="button" data-act="qr-arch" data-id="'+q.id+'">Archive instead</button><button class="btn gh" type="button" data-act="close">Cancel</button></div>')}
  if(act==='qr-kill'){S.p.qrs=S.p.qrs.filter(q=>q.id!==d.id);closeSheet();renderView();return toast('QR deleted')}
  if(act==='qr-arch'){S.p.qrs.find(q=>q.id===d.id).status='archived';closeSheet();renderView();return toast('QR archived')}
  if(act==='qr-save'){
    const n=$('#qn').value.trim(),u=normUrl($('#qu').value);if(!n){toast('Give this QR a name');return $('#qn').focus()}if(!u){toast('Enter where it should go');return $('#qu').focus()}
    const mode=$('#qm [aria-pressed="true"]')?$('#qm [aria-pressed="true"]').dataset.m:'dynamic';
    if(d.id){const q=S.p.qrs.find(x=>x.id===d.id);q.name=n;q.url=u;if(q.mode==='static')q.mode=mode}else S.p.qrs.unshift({id:'q'+Date.now(),name:n,url:u,mode:mode,status:'active',total:0,last:'No scans yet'});
    closeSheet();renderView();return toast(d.id?'QR saved':'QR created');
  }
  if(act==='resched')return sheet(head(S.p.appt?'Reschedule follow-up':'Schedule a follow-up')+'<div class="formgrid"><div class="fld"><label for="ad">Day</label><select class="sel" id="ad"><option>Thu, Oct 8</option><option>Fri, Oct 9</option><option>Mon, Oct 12</option><option>Tue, Oct 13</option></select></div><div class="fld"><label for="at">Time</label><select class="sel" id="at"><option>10:00 AM</option><option>12:30 PM</option><option selected>2:00 PM</option><option>4:30 PM</option></select></div><div class="fld"><span class="l">How</span><div class="opt" id="am"><button type="button" data-m="Phone call" aria-pressed="true"><b>Phone call</b><span>VMS calls you</span></button><button type="button" data-m="Video call" aria-pressed="false"><b>Video call</b><span>Link by email</span></button></div></div><button class="btn pri" type="button" data-act="appt-save">Save follow-up</button></div>');
  if(act==='appt-save'){const dd=$('#ad').value,parts=dd.split(', ')[1].split(' ');S.p.appt={date:dd,day:parts[1],mon:parts[0],time:$('#at').value,method:$('#am [aria-pressed="true"]').dataset.m,purpose:'Homepage design review'};S.p.cancelArm=false;closeSheet();renderView();return toast('Saved. VMS was notified.')}
  if(act==='cancel-appt'){if(!S.p.cancelArm){S.p.cancelArm=true;renderView();setTimeout(()=>{S.p.cancelArm=false;if(S.app==='portal'&&['home','schedule'].includes(S.view.portal))renderView()},4000);return}S.p.appt=null;S.p.cancelArm=false;renderView();return toast('Follow-up canceled. VMS was notified.')}
});
document.addEventListener('click',e=>{const b=e.target.closest('.opt button');if(!b||b.disabled)return;$$('.opt button',b.parentElement).forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
function setMode(mode){
  closeSheet();
  document.body.dataset.view=mode;
  $$('#pv .seg2 button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.app===mode)));
  if(mode!=='site'&&S.app!==mode){S.app=mode;renderShell()}
  window.scrollTo(0,0);
  try{history.replaceState(null,'','#/'+mode+(mode==='site'?'':'/'+S.view[mode]))}catch(e){}
}
$$('#pv .seg2 button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.app)));

/* command palette */
$('#palQ').addEventListener('input',e=>palRender(e.target.value));
$('#palQ').addEventListener('keydown',e=>{
  const items=$$('#palList .it');if(!items.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palSel=(palSel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.setAttribute('aria-selected',String(i===palSel)));items[palSel].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){e.preventDefault();palGo(palSel)}
});
$('#palList').addEventListener('click',e=>{const b=e.target.closest('.it');if(b)palGo(+b.dataset.i)});
$('#pal').addEventListener('click',e=>{if(e.target===$('#pal'))$('#pal').close()});
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}});

/* theme */
const themeBtn=$('#themeBtn');
function effectiveDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':false}
function paintTheme(){const dark=effectiveDark();themeBtn.innerHTML=ic(dark?'sun':'moon');themeBtn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')}
themeBtn.addEventListener('click',()=>{const next=effectiveDark()?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('vms-theme',next)}catch(e){}paintTheme();$$('meta[name=theme-color]').forEach(m=>m.content=next==='dark'?'#001a29':'#F3F7FA')});
try{const t=localStorage.getItem('vms-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
paintTheme();

/* start (supports deep links like #/portal/qr) */


const ADMIN_LH_KEY='vms_linkhub_admin_v2';
const QR_KEYS=['vms_qr_tools_v4','vms_qr_tools_final_v1','vms_qr_codes_v1','vms_saved_qrs_v1'];
const CLIENTS_KEY='vms_clients_final_v1';
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function lsList(v,ks){if(Array.isArray(v))return v;if(v&&typeof v==='object')for(const k of ks){if(Array.isArray(v[k]))return v[k]}return []}
function firstOf(keys){for(const k of keys){const v=lsGet(k);if(v!=null)return v}return null}
function initRealData(){
  // Clients
  const cr=lsGet(CLIENTS_KEY),cl=lsList(cr,['clients']).filter(c=>!c.archived);
  if(cl.length){CLIENTS.length=0;cl.forEach((c,i)=>CLIENTS.push({id:c.id||`c${i+1}`,name:c.name||c.business||'Client',email:c.email||'',mrr:Number(c.mrr||0),status:c.status||'Active',plan:c.plan||''}))}
  // Hubs
  const hr=lsGet(ADMIN_LH_KEY),hl=lsList(hr,['hubs']);
  hl.forEach((h,i)=>{
    const cm=CLIENTS.find(c=>c.id===h.id||c.id===h.client||c.name===h.client);
    const id=cm?cm.id:(h.id||h.client||`c${i+1}`);
    HUBS[id]=mkHub({name:h.name||h.businessName||'',tag:h.tag||h.tagline||'',bio:h.bio||'',theme:h.theme||'clean',btn:h.btn||'round',slug:h.slug||'',status:h.published||h.status==='Active'?'published':'draft',
      contact:{call:{on:!!(h.contact?.call?.on??h.phone),val:h.contact?.call?.val||h.phone||''},email:{on:!!(h.contact?.email?.on??h.email),val:h.contact?.email?.val||h.email||''},web:{on:!!(h.contact?.web?.on??h.website),val:h.contact?.web?.val||h.website||''},dir:{on:!!(h.contact?.dir?.on??h.address),val:h.contact?.dir?.val||h.address||''}},
      feats:{menu:h.feats?.menu||h.restaurant||{on:false,cats:[]},wifi:h.feats?.wifi||h.wifi||{on:false,net:'',pw:'',sec:'WPA2'},visit:h.feats?.visit||h.visit||{on:false,addr:'',week:[]}},
      links:(h.links||[]).map(l=>({id:l.id||'lk'+Math.random().toString(36).slice(2,6),label:l.label||l.title||l.name||'',url:l.url||l.href||'',on:l.on!==false,icon:l.icon||'link'})),
      social:h.social||h.socials||{instagram:'',facebook:'',tiktok:''},
      views:Number(h.analytics?.views??h.views??0),taps:Number(h.analytics?.taps??h.taps??0),top:h.top||[]
    });
  });
  // QR codes
  const qr=firstOf(QR_KEYS),ql=lsList(qr,['qrs','saved','codes']).filter(q=>!q.archived);
  if(ql.length){QRS.length=0;ql.forEach(q=>QRS.push(mkQr({id:q.id||'q'+Math.random().toString(36).slice(2,6),client:q.client||q.clientId||'c1',name:q.name||q.label||'QR Code',type:q.type||'link',url:q.url||q.destination||'',ssid:q.ssid||'',pw:q.pw||q.password||'',sec:q.sec||'WPA',mode:q.mode||(q.tracked?'dynamic':'static'),status:q.status||'active',preset:q.preset||'soft',shape:q.shape||'rounded',eye:q.eye||'rounded',fg:q.fg||'#003049',fg2:q.fg2||'#2b6a91',grad:q.grad||false,bg:q.bg||'#FFFFFF',logo:q.logo||'none',frame:q.frame||'box',frameText:q.frameText||'Scan me',template:q.template||'web',total:Number(q.total??q.scans??0),last:q.last||q.lastScan||'No scans yet',scans14:q.scans14||Array(14).fill(0),dev:q.dev||{iPhone:0,Android:0,Other:0}})))}
  // Entitlements
  CLIENTS.forEach(c=>{const p=c.plan||'';PLAN[c.id]={qr:/qr|smart|linkhub|pro|presence/i.test(p),tracked:/pro|presence/i.test(p),hub:/linkhub|hub|pro|presence/i.test(p),pro:/pro|presence/i.test(p)}});
  if(CLIENTS[0])S.tc=CLIENTS[0].id;
}
function saveHubToStorage(){
  try{const h=hubOf();if(!h)return;const raw=lsGet(ADMIN_LH_KEY)||[];if(!Array.isArray(raw)){toast('Save blocked: LinkHub data is in an older format');return}const list=raw;const cid=S.tc;const cname=(CLIENTS.find(c=>c.id===cid)||{}).name||cid;const idx=list.findIndex(x=>x.id===cid||x.client===cid||x.client===cname);const rec={id:cid,client:cname,name:h.name,tag:h.tag,bio:h.bio,theme:h.theme,btn:h.btn,slug:h.slug,status:h.status,contact:h.contact,feats:h.feats,links:h.links,social:h.social,published:h.status==='published',updatedAt:new Date().toISOString()};if(idx>=0)list[idx]=Object.assign({},list[idx],rec);else list.push(rec);localStorage.setItem(ADMIN_LH_KEY,JSON.stringify(list));try{document.dispatchEvent(new CustomEvent('vms-linkhub-admin-saved',{detail:{hub:rec}}))}catch(e){}toast('Saved \u2713')}catch(e){toast('Save failed: '+e.message)}}


initRealData();
// Wire save button
// Set to tools view and render
S.app='admin';S.view.admin='tools';S.tool='qr';
window.__vmsLinkHub={refresh(){initRealData();renderView()}};
renderShell();
// Listen for localStorage changes from other tabs
window.addEventListener('storage',()=>{initRealData();renderView()});
// Apply saved theme
try{const t=localStorage.getItem('vms-theme');if(t)document.documentElement.dataset.theme=t}catch{}
})();
