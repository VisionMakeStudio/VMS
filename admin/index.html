<!doctype html>
<html lang="en">
<head><script>if(location.protocol!=='file:')document.documentElement.classList.add('vms-auth-pending');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F3F7FA">
  <title>VMS Admin — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <script src="../assets/config.js"></script>
  <link rel="stylesheet" href="/assets/vms-admin-shell.css">
  <style>
    /* Admin Home — approved preview layout. Tokens come from /assets/vms-admin-shell.css. */
    .home{max-width:1240px;margin:0 auto}
    .greet{display:grid;gap:4px;margin:6px 0 16px}
    .greet h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,5.5vw,2rem);letter-spacing:-.03em;line-height:1.12;color:var(--ink)}
    .greet p{margin:0;color:var(--muted)}
    .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0;color:var(--ink);text-decoration:none}
    .kpi .l{font-size:13px;color:var(--muted);font-weight:500}
    .kpi .v{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,5.6vw,1.75rem);letter-spacing:-.04em;line-height:1.1}
    .kpi .d{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted)}
    .kpi .d b{font-weight:600;color:var(--ok)}
    .kpi .d b.bad{color:var(--badfg)}
    .kpi svg.sp{display:block;width:100%;height:30px;overflow:visible}
    .sp path{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .sp path.fillp{fill:url(#spf);stroke:none;opacity:.5}
    .sp-flat{height:30px;display:flex;align-items:center}.sp-flat i{display:block;width:100%;height:2px;border-radius:2px;background:var(--tint)}
    .grid2{display:grid;gap:14px;margin-top:14px}
    .dash{display:grid;gap:14px;align-content:start}
    .hcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
    .sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .sect-h h3{margin:0;font-family:var(--display);font-weight:700;font-size:.98rem;letter-spacing:-.02em;color:var(--ink)}
    .sect-h a{font-size:14px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:8px 0}
    .att .row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
    .att .row:last-child{border:0;padding-bottom:0}.att .row:first-child{padding-top:0}
    .att .dt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--ink)}
    .att .dt.w{background:var(--warmbg);color:var(--warmfg)}.att .dt.b{background:var(--badbg);color:var(--badfg)}.att .dt.o{background:var(--okbg);color:var(--ok)}
    .att b{display:block;font-weight:600;line-height:1.35}.att .s{display:block;color:var(--muted);font-size:13.5px}
    .att .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 14px/1 var(--body);text-decoration:none;white-space:nowrap;transition:transform .15s,border-color .18s,box-shadow .18s}
    .hbtn:hover{border-color:var(--ink)}.hbtn:active{transform:scale(.97)}
    .hbtn.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg)}.hbtn.pri:hover{box-shadow:0 8px 20px rgba(0,48,73,.25)}
    .empty-h{padding:26px 8px;text-align:center;color:var(--muted)}
    .funnel{display:grid;gap:12px}
    .fbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--tint);gap:3px}
    .fbar i{display:block;min-width:8px;border-radius:99px;transition:flex .6s cubic-bezier(.2,.8,.2,1)}
    .fleg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fleg a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
    .fleg a:hover{border-color:var(--ink)}
    .fleg span{display:flex;align-items:center;gap:8px}.fleg span i{width:9px;height:9px;border-radius:50%}
    .fleg em{font-style:normal;font-family:var(--display);font-size:15px}
    .tl .r{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:16px;position:relative;color:var(--ink);text-decoration:none}
    .tl .r::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
    .tl .r:last-child{padding-bottom:0}.tl .r:last-child::before{display:none}
    .tl .r i{width:14px;height:14px;border-radius:50%;background:var(--blue);margin-top:4px;box-shadow:0 0 0 4px var(--tint)}
    .tl .r i.w{background:var(--orange)}
    .tl .r b{font-weight:600;display:block;line-height:1.35}.tl .r span{color:var(--muted);font-size:13.5px}
    .ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .qmenu{position:fixed;z-index:2147482500;top:calc(68px + env(safe-area-inset-top,0px));right:32px;width:min(300px,92vw);padding:8px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-lg);display:none}
    .qmenu.open{display:grid}
    .qmenu a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px}
    .qmenu a:hover{background:var(--tint)}
    @media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
    @media (min-width:1000px){.kpis{gap:14px}.grid2{grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}}
    @media (max-width:999px){.qmenu{right:12px;top:calc(64px + env(safe-area-inset-top,0px))}}
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="spf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#669BBC" stop-opacity=".7"/><stop offset="1" stop-color="#669BBC" stop-opacity="0"/></linearGradient></defs></svg>
  <div class="app">
    <main class="main">
      <header class="topbar">
        <div class="top-actions">
          <button class="btn primary" id="quickActionBtn" type="button" aria-expanded="false" aria-controls="quickMenu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
        </div>
      </header>
      <div class="home" id="home">
        <div class="greet"><h2 id="greetTitle">Welcome back</h2><p id="greetSub">Loading your studio.</p></div>
        <div class="kpis" id="kpis"></div>
        <div class="grid2">
          <div class="dash">
            <section class="hcard"><div class="sect-h"><h3>Needs your attention</h3><a href="activity.html">Activity</a></div><div class="att" id="attentionList"></div></section>
            <section class="hcard"><div class="sect-h"><h3>Pipeline</h3><a href="leads.html">See all</a></div><div class="funnel" id="pipeline"></div></section>
          </div>
          <section class="hcard"><div class="sect-h"><h3>Recent activity</h3></div><div class="tl" id="activityList"></div></section>
        </div>
      </div>
    </main>
  </div>

  <nav class="qmenu" id="quickMenu" aria-label="Create">
    <a href="leads.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 13h5l1 3h6l1-3h5"/></svg>Lead</a>
    <a href="clients.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/></svg>Client</a>
    <a href="audit.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1 2h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3zM9 13l2 2 4-4"/></svg>Audit</a>
    <a href="qr.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 3.5h6.5v6.5H3.5zM14 3.5h6.5v6.5H14zM3.5 14h6.5v6.5H3.5zM14 14h3v3h-3z"/></svg>QR code</a>
    <a href="billing.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zM3 10h18M7 15h4"/></svg>Sale</a>
    <a href="projects.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h17v15h-17zM3.5 10h17M8 3v4M16 3v4"/></svg>Request or project</a>
    <a href="linkhub.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>LinkHub</a>
    <a href="promotions.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5L5 19M7.5 8a1.5 1.5 0 1 0 0-.01M16.5 17a1.5 1.5 0 1 0 0-.01"/></svg>Promotion</a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function(){
    const $=id=>document.getElementById(id);
    const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
    const number=new Intl.NumberFormat('en-US');
    const now=new Date();
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const P={inbox:'M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 13h5l1 3h6l1-3h5',card:'M3 6h18v12H3zM3 10h18M7 15h4',audit:'M9 4h6l1 2h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3zM9 13l2 2 4-4',file:'M6 3h8l4 4v14H6zM14 3v4h4',cal:'M3.5 5h17v15h-17zM3.5 10h17M8 3v4M16 3v4',link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',bell:'M18 9a6 6 0 0 0-12 0c0 6.5-3 8-3 8h18s-3-1.5-3-8M13.7 20.5a2 2 0 0 1-3.4 0'};
    const ic=n=>'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(P[n]||P.file)+'"/></svg>';
    let leads=[],leadsLoaded=false;

    const storage={
      clients:['vms_clients_final_v1'],
      billing:['vms_billing_subscriptions_v3'],
      work:['vms_work_admin_v2','vms_work_admin_v1'],
      notifications:['vms_notifications_activity_v2','vms_notifications_activity_v1'],
      files:['vms_files_assets_v2','vms_files_assets_v1'],
      hubs:['vms_linkhub_admin_v2'],
      promos:['vms_promotions_v2','vms_promotions_prototype_v1'],
      catalog:['vms_service_catalog_v2','vms_service_catalog_demo_v1'],
      audits:['vms_phase3_history_v1','vms_audit_history','vmsHistory','phase3_history','auditHistory'],
      auditRequests:['vms_phase5_requests_v1'],
      qr:['vms_qr_tools_v4','vms_qr_tools_final_v1','vms_qr_codes_v1','vms_saved_qrs_v1']
    };

    function parse(key){
      try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):null}catch(e){return null}
    }
    function first(keys){for(const key of keys){const value=parse(key);if(value!==null)return value}return null}
    function list(value,keys=[]){
      if(Array.isArray(value))return value;
      if(value&&typeof value==='object')for(const key of keys){if(Array.isArray(value[key]))return value[key]}
      return [];
    }
    function text(value){return String(value??'').trim()}
    function lower(value){return text(value).toLowerCase()}
    function isDemo(item){
      const combined=[item?.id,item?.client,item?.business,item?.name,item?.email].map(lower).join(' ');
      return combined.includes('demo ')||combined.includes('demo-')||combined.includes('@example.')||combined.endsWith('.example');
    }
    function clean(items){return items.filter(item=>item&&!isDemo(item))}
    function activeStatus(value){return !['archived','canceled','cancelled','completed','declined','deleted'].includes(lower(value))}
    function isSameMonth(dateValue){const d=new Date(dateValue);return !Number.isNaN(d.getTime())&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}
    function isOverdue(dateValue){if(!dateValue)return false;const d=new Date(String(dateValue).slice(0,10)+'T23:59:59');return !Number.isNaN(d.getTime())&&d<now}
    function niceDate(value){
      if(!value)return 'No date';
      const d=new Date(value);if(Number.isNaN(d.getTime()))return text(value);
      return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1800)}

    function collect(){
      const clients=clean(list(first(storage.clients),['clients']));
      const activeClients=clients.filter(c=>!c.archived&&activeStatus(c.status||'Active'));

      const billing=first(storage.billing)||{};
      const subscriptions=clean(list(billing,['subscriptions'])).filter(s=>!s.archived);
      const activeSubscriptions=subscriptions.filter(s=>['active','grace','past due','suspended','canceling'].includes(lower(s.status)));
      const billingIssues=subscriptions.filter(s=>['past due','grace','suspended','failed','payment failed'].includes(lower(s.status)));
      const mrr=activeSubscriptions.reduce((sum,s)=>{
        const price=Number(s.price??s.recurringPrice??s.amount)||0;
        const cycle=lower(s.cycle||s.cadence||'monthly');
        return sum+(cycle.includes('year')?price/12:cycle.includes('week')?price*4.33:price);
      },0);
      const subscriptionPayments=subscriptions.flatMap(s=>Array.isArray(s.payments)?s.payments:[]);
      const oneTime=list(billing,['oneTimePayments','payments']);
      const payments=clean([...subscriptionPayments,...oneTime]);
      const collected=payments.filter(p=>lower(p.status)==='paid'&&isSameMonth(p.date||p.paidAt||p.createdAt)).reduce((sum,p)=>sum+(Number(p.amount)||0),0);
      const invoices=clean(list(billing,['invoices']));
      const unpaidInvoices=invoices.filter(i=>!['paid','void','canceled','cancelled'].includes(lower(i.status)));

      const work=first(storage.work)||{};
      const requests=clean(list(work,['requests'])).filter(r=>activeStatus(r.status));
      const projects=clean(list(work,['projects'])).filter(p=>activeStatus(p.status));
      const overdueProjects=projects.filter(p=>isOverdue(p.dueDate));

      const auditHistory=clean(list(first(storage.audits),['audits','history']));
      const auditRequests=clean(list(first(storage.auditRequests),['requests'])).filter(r=>activeStatus(r.status));
      const auditsToReview=auditRequests.length+auditHistory.filter(a=>['requested','needs review','in review','draft'].includes(lower(a.status))).length;

      const qrs=clean(list(first(storage.qr),['qrs','saved','codes']));
      const activeQrs=qrs.filter(q=>!q.archived&&activeStatus(q.status||'Active'));
      const qrScans=activeQrs.reduce((sum,q)=>sum+(Number(q.scansThisMonth??q.monthlyScans??q.scans)||0),0);

      const notifications=clean(list(first(storage.notifications),['items','activity'])).filter(n=>!n.deleted);
      const notificationNeeds=notifications.filter(n=>n.needsAction&&!n.resolved);

      const fileData=first(storage.files)||{};
      const assets=clean(list(fileData,['assets'])).filter(a=>!a.archived);
      const fileRequests=clean(list(fileData,['requests'])).filter(r=>!['fulfilled','received','complete','completed','canceled'].includes(lower(r.status)));

      const hubs=clean(list(first(storage.hubs),['hubs']));
      const activeHubs=hubs.filter(h=>!h.archived&&['active','published','live'].includes(lower(h.status||h.serviceStatus)));
      const hubAttention=hubs.filter(h=>['grace','suspended','past due','disabled'].includes(lower(h.status||h.serviceStatus||h.billingStatus)));
      const hubViews=activeHubs.reduce((sum,h)=>sum+(Number(h.analytics?.views??h.views)||0),0);

      const promoData=first(storage.promos)||{};
      const promos=clean(list(promoData,['promotions','items']));
      const activePromos=promos.filter(p=>!p.archived&&lower(p.manualStatus||p.status)==='active');

      const catalog=first(storage.catalog);
      const catalogItems=clean(Array.isArray(catalog)?catalog:[...list(catalog,['services']),...list(catalog,['packages'])]);
      const publishedServices=catalogItems.filter(s=>!s.archived&&['published','active'].includes(lower(s.status||'published')));

      const attentionCount=billingIssues.length+overdueProjects.length+auditRequests.length+notificationNeeds.length+fileRequests.filter(r=>isOverdue(r.dueDate)||lower(r.status).includes('reminder')).length+hubAttention.length;
      return {clients,activeClients,billing,subscriptions,activeSubscriptions,billingIssues,mrr,collected,invoices,unpaidInvoices,requests,projects,overdueProjects,auditHistory,auditRequests,auditsToReview,qrs,activeQrs,qrScans,notifications,notificationNeeds,assets,fileRequests,hubs,activeHubs,hubAttention,hubViews,promos,activePromos,publishedServices,attentionCount};
    }


    function relTime(v){
      const d=new Date(v);if(!v||Number.isNaN(d.getTime()))return '';
      const m=Math.round((Date.now()-d.getTime())/60000);
      if(m<1)return 'Just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');
      const days=Math.round(h/24);if(days===1)return 'Yesterday';if(days<7)return days+' days ago';
      return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }
    function monthKey(d){return d.getFullYear()+'-'+d.getMonth()}
    function series(items,dateOf,valueOf){
      const out=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({k:monthKey(d),v:0})}
      items.forEach(it=>{const d=new Date(dateOf(it));if(Number.isNaN(d.getTime()))return;const row=out.find(o=>o.k===monthKey(d));if(row)row.v+=valueOf(it)});
      return out.map(o=>o.v);
    }
    function cumulative(a){let n=0;return a.map(v=>n+=v)}
    function spark(a){
      if(!a.length||a.every(v=>v===a[0]))return '<div class="sp-flat" aria-hidden="true"><i></i></div>';
      const w=100,h=30,mx=Math.max(...a),mn=Math.min(...a),r=mx-mn||1;
      const p=a.map((v,i)=>[i*(w/(a.length-1)),h-3-((v-mn)/r)*(h-8)]);
      const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
      return '<svg class="sp" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="fillp" d="'+d+' L'+w+' '+h+' L0 '+h+'Z"/><path d="'+d+'"/></svg>';
    }
    const leadStage=l=>{const s=String(l.status||'new').toLowerCase();return ['new','contacted','qualified','won','lost'].includes(s)?s:'new'};

    async function loadLeads(){
      try{
        if(!window.VMSAuth?.client)return;
        const sb=await VMSAuth.client();const {data:{session}}=await sb.auth.getSession();
        if(!session?.access_token)return;
        const r=await fetch('/api/leads',{headers:{Authorization:'Bearer '+session.access_token}});
        const d=await r.json().catch(()=>({}));
        if(r.ok){leads=Array.isArray(d.leads)?d.leads:Array.isArray(d)?d:[];leadsLoaded=true;render()}
      }catch(e){console.warn('VMS Home: leads unavailable',e)}
    }

    function render(){
      const d=collect();
      const hour=now.getHours();
      const part=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
      const owner=(document.querySelector('#vmsCanonicalAdminSidebar .vms-side-me b')?.textContent||'').trim().split(/\s+/)[0];
      $('greetTitle').textContent=owner?part+', '+owner:part;

      /* Needs your attention */
      const att=[];
      const newLeads=leads.filter(l=>leadStage(l)==='new');
      newLeads.slice(0,2).forEach(l=>att.push({dt:'',icon:'inbox',title:'New request from '+(l.business_name||l.contact_name||'a new lead'),sub:[l.source,relTime(l.created_at)].filter(Boolean).join(' · '),acts:[['Start audit','audit.html','pri'],['Open lead','leads.html?lead='+encodeURIComponent(l.id||'')]]}));
      d.billingIssues.forEach(s=>att.push({dt:'b',icon:'card',title:(s.client||s.service||'A subscription')+' payment needs attention',sub:[s.service,s.status].filter(Boolean).join(' · '),acts:[['View billing','billing.html','pri']]}));
      d.overdueProjects.forEach(p=>att.push({dt:'b',icon:'cal',title:(p.name||p.title||'A project')+' is overdue',sub:[p.client,'Due '+niceDate(p.dueDate)].filter(Boolean).join(' · '),acts:[['Open project','projects.html','pri']]}));
      d.auditRequests.forEach(a=>att.push({dt:'w',icon:'audit',title:(a.businessName||a.business||a.client||'A business')+' audit is waiting',sub:a.status||'Needs review',acts:[['Open audit','audit.html','pri']]}));
      d.fileRequests.filter(r=>isOverdue(r.dueDate)||lower(r.status).includes('reminder')).forEach(r=>att.push({dt:'o',icon:'file',title:(r.name||'A requested file')+' is still needed',sub:[r.client,r.status].filter(Boolean).join(' · '),acts:[['Open files','files.html']]}));
      d.hubAttention.forEach(h=>att.push({dt:'w',icon:'link',title:(h.client||h.businessName||'A client')+' LinkHub needs attention',sub:h.status||h.serviceStatus||h.billingStatus||'',acts:[['Open LinkHub','linkhub.html']]}));
      d.notificationNeeds.forEach(n=>att.push({dt:lower(n.priority)==='urgent'?'b':'w',icon:'bell',title:n.title||'An update needs action',sub:n.client||n.source||'',acts:[['Open',n.target||'activity.html']]}));
      const shown=att.slice(0,5);
      $('attentionList').innerHTML=shown.length?shown.map(a=>'<div class="row"><div class="dt '+a.dt+'">'+ic(a.icon)+'</div><div><b>'+esc(a.title)+'</b>'+(a.sub?'<span class="s">'+esc(a.sub)+'</span>':'')+'<div class="acts">'+a.acts.map(x=>'<a class="hbtn'+(x[2]?' '+x[2]:'')+'" href="'+esc(x[1])+'">'+esc(x[0])+'</a>').join('')+'</div></div></div>').join(''):'<div class="empty-h">Nothing waiting. Nice work.</div>';
      $('greetSub').textContent=att.length?(att.length===1?'1 thing needs you today.':att.length+' things need you today.'):'You are all caught up.';

      /* KPIs */
      const openLeads=leads.filter(l=>!['won','lost'].includes(leadStage(l)));
      const newThisMonth=d.activeClients.filter(c=>isSameMonth(c.createdAt||c.created_at||c.since||c.startDate)).length;
      const mrrSeries=cumulative(series(d.activeSubscriptions,s=>s.startDate||s.start||s.createdAt||s.created_at,s=>{const price=Number(s.price??s.recurringPrice??s.amount)||0;const c=lower(s.cycle||s.cadence||'monthly');return c.includes('year')?price/12:c.includes('week')?price*4.33:price}));
      const clientSeries=cumulative(series(d.activeClients,c=>c.createdAt||c.created_at||c.since,()=>1));
      const leadSeries=series(leads,l=>l.created_at,()=>1);
      const k=[
        {l:'Monthly recurring',v:money.format(d.mrr),sp:mrrSeries,dd:'<b>'+number.format(d.activeSubscriptions.length)+(d.activeSubscriptions.length===1?' plan':' plans')+'</b>active',href:'billing.html'},
        {l:'Active clients',v:number.format(d.activeClients.length),sp:clientSeries,dd:'<b>+'+number.format(newThisMonth)+'</b>this month',href:'clients.html'},
        {l:'Open leads',v:leadsLoaded?number.format(openLeads.length):'–',sp:leadSeries,dd:'<b>'+number.format(newLeads.length)+' new</b>waiting',href:'leads.html'},
        {l:'QR scans this month',v:number.format(d.qrScans),sp:[],dd:'<b>'+number.format(d.activeQrs.length)+'</b>active codes',href:'qr.html'}
      ];
      $('kpis').innerHTML=k.map(x=>'<a class="kpi" href="'+x.href+'"><span class="l">'+x.l+'</span><span class="v">'+x.v+'</span>'+spark(x.sp)+'<span class="d">'+x.dd+'</span></a>').join('');

      /* Pipeline */
      const stages=[['new','New','var(--blue)'],['contacted','Contacted','var(--orange)'],['qualified','Qualified','var(--navy)'],['won','Won','var(--ok)']];
      const cnt={};stages.forEach(([s])=>cnt[s]=leads.filter(l=>leadStage(l)===s).length);
      $('pipeline').innerHTML='<div class="fbar" role="img" aria-label="Leads by stage">'+stages.map(([s,,c])=>'<i style="flex:'+Math.max(cnt[s],.3)+';background:'+c+'"></i>').join('')+'</div><div class="fleg">'+stages.map(([s,label,c])=>'<a href="leads.html?stage='+s+'"><span><i style="background:'+c+'"></i>'+label+'</span><em>'+(leadsLoaded?cnt[s]:'–')+'</em></a>').join('')+'</div>';

      /* Recent activity */
      const acts=d.notifications.slice().sort((a,b)=>new Date(b.createdAt||b.date||0)-new Date(a.createdAt||a.date||0)).slice(0,6);
      $('activityList').innerHTML=acts.length?acts.map(n=>'<a class="r" href="'+esc(n.target||'activity.html')+'"><i'+(n.needsAction&&!n.resolved?' class="w"':'')+'></i><div><b>'+esc(n.title||n.type||'Studio update')+'</b><span>'+esc([relTime(n.createdAt||n.date),n.client].filter(Boolean).join(' · '))+'</span></div></a>').join(''):'<div class="empty-h">Updates from your tools will show up here.</div>';
    }

    const qBtn=$('quickActionBtn'),qMenu=$('quickMenu');
    function setMenu(open){qMenu.classList.toggle('open',open);qBtn.setAttribute('aria-expanded',String(open))}
    document.addEventListener('click',e=>{
      if(e.target.closest('#quickActionBtn')){e.stopPropagation();setMenu(!qMenu.classList.contains('open'));return}
      if(!qMenu.contains(e.target))setMenu(false);
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
    window.addEventListener('storage',render);
    window.addEventListener('focus',render);
    render();
    window.addEventListener('load',()=>setTimeout(render,0));
    if(location.protocol!=='file:')loadLeads();
  })();
  </script>
<script src="../assets/vms-core.js"></script><script src="../assets/vms-state.js"></script><script>(async()=>{if(location.protocol!=='file:'){const user=await VMSAuth.requireSession('admin');if(!user)return;const state=await VMSState.start({scope:'admin',user});if(state?.reloading)return}})();</script>  <script src="/assets/vms-admin-shell.js"></script>
</body>
</html>
