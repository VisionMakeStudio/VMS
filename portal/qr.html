<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VMS Client Portal — QR Analytics</title><style>:root{--navy:#003049;--blue:#669BBC;--ink:#173443;--muted:#71858f;--line:#dce6ea;--bg:#f4f6f8;--green:#23814c}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% -10%,rgba(102,155,188,.14),transparent 30%),var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.top{height:68px;background:rgba(255,255,255,.9);border-bottom:1px solid #dfe7ea;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:10}.top img{width:78px;max-height:44px;object-fit:contain}.btn{border:1px solid #d8e3e7;background:#fff;color:var(--navy);border-radius:11px;padding:9px 12px;font-size:10px;font-weight:850}.wrap{max-width:1120px;margin:auto;padding:24px 15px 44px}.hero small{font-size:9px;color:var(--blue);font-weight:900;letter-spacing:.12em}.hero h1{font-size:30px;letter-spacing:-.04em;margin:5px 0 8px}.hero p{color:var(--muted);font-size:11.5px;line-height:1.55;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat,.card{background:#fff;border:1px solid rgba(0,48,73,.09);border-radius:17px;padding:15px;box-shadow:0 10px 30px rgba(0,48,73,.05)}.stat span{font-size:8.5px;color:#7b8e97;text-transform:uppercase;font-weight:900}.stat strong{display:block;font-size:25px;margin-top:7px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.card h2{font-size:15px;margin:0 0 11px}.list{display:grid;gap:8px}.qr{border:1px solid var(--line);border-radius:13px;padding:11px;display:grid;grid-template-columns:1fr auto;gap:10px}.qr strong{font-size:11px}.qr span{display:block;color:var(--muted);font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;margin-top:6px;border-radius:999px;background:#eaf7f1;color:#267659;font-size:8px;font-weight:850;padding:5px 7px}.count{font-size:20px;font-weight:900;color:var(--navy)}.scan{display:grid;grid-template-columns:35px 1fr auto;gap:9px;align-items:center;padding:9px;border-bottom:1px solid #edf2f4}.scan:last-child{border-bottom:0}.ico{width:35px;height:35px;border-radius:10px;background:#edf5f8;display:grid;place-items:center;font-size:8px;font-weight:900}.scan strong{font-size:10px}.scan span{display:block;font-size:8.5px;color:var(--muted);margin-top:3px}.scan time{font-size:8px;color:#84969f}.empty{text-align:center;padding:25px;border:1px dashed #cfdbdf;border-radius:13px;color:var(--muted);font-size:10px;line-height:1.5}@media(max-width:760px){.wrap{padding-top:15px}.hero h1{font-size:24px}.stats{display:flex;overflow-x:auto;scrollbar-width:none}.stat{flex:0 0 145px}.layout{grid-template-columns:1fr}.scan{grid-template-columns:35px 1fr}.scan time{grid-column:2}}</style></head><body><header class="top"><img src="../assets/vms-logo.png" alt="VMS"><a class="btn" href="./">Back to Portal</a></header><main class="wrap"><section class="hero"><small>CLIENT PORTAL · QR ANALYTICS</small><h1>Your QR activity</h1><p>Real scan activity from Dynamic QR codes assigned to your business. Static QR codes continue to work but do not collect analytics.</p></section><section class="stats"><div class="stat"><span>Dynamic QRs</span><strong id="tracked">—</strong></div><div class="stat"><span>Total Scans</span><strong id="total">—</strong></div><div class="stat"><span>Today</span><strong id="today">—</strong></div><div class="stat"><span>This Month</span><strong id="month">—</strong></div></section><div class="layout"><section class="card"><h2>Your QR codes</h2><div id="qrs" class="list"></div></section><section class="card"><h2>Recent scans</h2><div id="scans"></div></section></div></main><script src="../assets/config.js"></script><script src="../assets/vms-core.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat().format(Number(n)||0);async function token(){const sb=await VMSAuth.client();const{data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw new Error('Sign in again.');return session.access_token}async function load(){const t=await token(),r=await fetch('/api/qr',{headers:{Authorization:`Bearer ${t}`}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load QR analytics.');const q=d.qrs||[],s=d.scans||[],day=new Date();day.setHours(0,0,0,0);const mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);$('#tracked').textContent=fmt(q.filter(x=>x.status==='active'&&x.mode==='dynamic').length);$('#total').textContent=fmt(q.reduce((a,x)=>a+Number(x.scan_count||0),0));$('#today').textContent=fmt(s.filter(x=>new Date(x.scanned_at)>=day).length);$('#month').textContent=fmt(s.filter(x=>new Date(x.scanned_at)>=mo).length);$('#qrs').innerHTML=q.length?q.filter(x=>x.status!=='archived').map(x=>`<div class="qr"><div><strong>${esc(x.name)}</strong><span>${esc(x.destination)}</span>${x.mode==='dynamic'?'<span class="badge">Dynamic · Tracked</span>':''}</div><div class="count">${fmt(x.scan_count)}</div></div>`).join(''):'<div class="empty">No QR codes assigned to your account yet.</div>';const map=new Map(q.map(x=>[x.id,x]));$('#scans').innerHTML=s.length?s.slice(0,30).map(x=>`<div class="scan"><div class="ico">QR</div><div><strong>${esc(map.get(x.qr_id)?.name||'QR scan')}</strong><span>${esc(x.device_type||'Unknown device')}</span></div><time>${new Date(x.scanned_at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</time></div>`).join(''):'<div class="empty">No real scans yet.</div>'}document.addEventListener('DOMContentLoaded',async()=>{try{await VMSAuth.requireSession('client');await load();setInterval(()=>{if(document.visibilityState==='visible')load().catch(()=>{})},15000)}catch(e){console.error(e)}})})();
</script></body></html>
